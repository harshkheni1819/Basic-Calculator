<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" value="0" readonly />
    <div class="buttons">
      <!-- Memory Row -->
      <button class="btn">MC</button>
      <button class="btn">MR</button>
      <button class="btn" onclick="memoryAdd()">M+</button>
      <button class="btn" onclick="memorySubtract()">M-</button>
      <button class="btn" onclick="memoryStore()">MS</button>

      <!-- Special Row -->
      <button class="btn">Mv</button>
      <button class="btn" onclick="percentage()">%</button>
      <button class="btn" onclick="clearDisplay()">CE</button>
      <button class="btn" onclick="clearDisplay()">C</button>
      <button class="btn" onclick="backspace()">⌫</button>

      <!-- Function Row -->
      <button class="btn" onclick="appendValue('(')">(</button>
      <button class="btn" onclick="appendValue(')')">)</button>
      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      
      <button class="btn" onclick="squareRoot()">√</button>
      <button class="btn" onclick="appendValue('/')">÷</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('4')">4</button>
    
      <button class="btn" onclick="appendValue('*')">×</button>
      <button class="btn" onclick="appendValue('-')">−</button>
      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>

      <button class="btn" onclick="appendValue('+')">+</button>
      <button class="btn" onclick="plusMinus()">±</button>
      <button class="btn" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
      <button class="btn equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
